name: Reproduce paper results
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/check_release.py
      - run: uv run python scripts/reproduce.py
      - run: uv run pytest -q --basetemp .tmp -p no:cacheprovider
      - run: uv run grain-prices --help
